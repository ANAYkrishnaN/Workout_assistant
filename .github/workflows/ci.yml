# CI: lint, test, build frontend & backend; build Docker images.
# For AWS deploy: add env vars (e.g. AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ECR registry)
# and a deploy job that pushes images and updates ECS/App Runner.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NEXT_PUBLIC_API_URL: https://api.example.com
  NEXT_PUBLIC_OPENWEATHER_API_KEY: ""
  NEXT_PUBLIC_GEMINI_API_KEY: ""

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: .

      - name: Verify backend
        run: python -c "from main import app; print('OK')"
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: workout-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: workout-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_OPENWEATHER_API_KEY=${{ env.NEXT_PUBLIC_OPENWEATHER_API_KEY }}
            NEXT_PUBLIC_GEMINI_API_KEY=${{ env.NEXT_PUBLIC_GEMINI_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
